<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>華山派 수련장</title>
<style>
  :root { --ink: #2b1d22; --paper: #fbf7ef; --paper2: #f3ebdd; --rim: #ead9c4; --accent: #b4475f; --gold: #e0b84e;
          --ok: #4fb286; --mid: #e3a33a; --bad: #d64545; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1418; color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  button { font: inherit; }

  /* 두루마리 느낌의 창 */
  .win { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px;
         box-shadow: inset 0 0 0 2px var(--rim), 4px 4px 0 rgba(0,0,0,.45); }
  .title { background: linear-gradient(#c65a73, #96294a); color: #fff; font-weight: 800; font-size: 13px;
           padding: 3px 8px; text-shadow: 1px 1px 0 #55122a; border-bottom: 3px solid var(--ink);
           display: flex; align-items: center; gap: 6px; border-radius: 3px 3px 0 0; }

  /* 상단 문파 정보 */
  #top { position: fixed; top: 6px; left: 6px; right: 6px; z-index: 2; display: flex; align-items: stretch;
         gap: 6px; padding: 4px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  #top .plate { background: var(--ink); color: #f6dfe5; font-weight: 900; padding: 3px 12px 3px 8px; border-radius: 3px;
                display: flex; align-items: center; gap: 6px; letter-spacing: .03em; }
  #top .plate svg { flex: none; }
  #top .cell { background: var(--paper2); border: 2px solid #dcc6a8; border-radius: 4px; padding: 2px 9px;
               display: flex; align-items: center; gap: 5px; font-size: 13px; }
  #top .cell .lbl { font-size: 11px; font-weight: 800; color: #fff; background: #8e3049; padding: 0 5px; border-radius: 3px; }
  #top .cell b { font-size: 15px; }

  /* 하단: 문파 소식 + 메뉴 */
  #bottom { position: fixed; left: 6px; right: 6px; bottom: 6px; z-index: 2; display: flex; gap: 6px; height: 96px; }
  #log { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  #logLines { flex: 1; padding: 4px 8px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column;
              justify-content: flex-end; overflow: hidden; }
  #logLines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #logLines .tm { color: #a08770; font-size: 11px; margin-right: 5px; font-variant-numeric: tabular-nums; }
  #logLines .nm { font-weight: 800; }
  #menu { display: grid; grid-template-columns: repeat(4, 60px); gap: 6px; }
  .btn { background: linear-gradient(#fffaf0, #efdfc4); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px;
         box-shadow: inset 0 -3px 0 #c9a77a, 3px 3px 0 rgba(0,0,0,.45); cursor: pointer; text-decoration: none;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 22px; padding: 0; }
  .btn span { font-size: 12px; font-weight: 800; }
  .btn:active { transform: translate(2px, 2px); box-shadow: inset 0 -1px 0 #c9a77a, 1px 1px 0 rgba(0,0,0,.45); }

  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 112px; background: rgba(43,29,34,.86); color: #fbf7ef;
          padding: 4px 12px; border-radius: 12px; font-size: 12px; z-index: 2; pointer-events: none; max-width: 92vw; text-align: center; }
  #toasts { position: fixed; top: 64px; right: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  .toast { background: var(--paper); border: 3px solid var(--ink); padding: 6px 10px; border-radius: 6px; font-size: 13px;
           font-weight: 700; box-shadow: 3px 3px 0 rgba(0,0,0,.4); animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }

  /* 대화창 */
  #dlg { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); width: min(760px, calc(100vw - 16px));
         z-index: 4; display: flex; gap: 12px; padding: 12px; cursor: pointer; }
  #dlg[hidden] { display: none; }
  .portrait { image-rendering: pixelated; background: linear-gradient(#f8e6ea, #efd9c6); border: 3px solid var(--ink); border-radius: 6px; flex: none; }
  #portrait { width: 84px; height: 84px; }
  #dlg .body { flex: 1; min-width: 0; }
  #dlg .who { font-weight: 800; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #dlg .who .role { font-weight: 600; font-size: 12px; color: #80606a; }
  #dlg .text { margin-top: 6px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
               min-height: 4.6em; max-height: 36vh; overflow-y: auto; }
  #dlg .foot { display: flex; justify-content: space-between; font-size: 12px; color: #a08770; margin-top: 4px; }
  #dlg .next { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .chip { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 4px; color: #fff; }

  /* 모달 (제자 명부 / 장부) */
  #modal { position: fixed; inset: 0; z-index: 5; background: rgba(20,8,12,.5); display: flex; align-items: center; justify-content: center; }
  #modal[hidden] { display: none; }
  #modal .sheet { width: min(860px, 96vw); max-height: 84vh; display: flex; flex-direction: column; }
  #modal .title { font-size: 15px; padding: 6px 10px; }
  #modal .title button { margin-left: auto; background: var(--ink); color: #fff; border: 0; border-radius: 4px;
                         width: 26px; height: 24px; cursor: pointer; font-weight: 900; }
  #mBody { overflow-y: auto; padding: 10px; }
  .staff { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .card { background: var(--paper2); border: 2px solid #dcc6a8; border-radius: 6px; padding: 8px; display: flex; gap: 8px; }
  .card .portrait { width: 56px; height: 56px; }
  .card .info { flex: 1; min-width: 0; font-size: 12px; }
  .card .nm { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: #80606a; margin: 1px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { display: grid; grid-template-columns: 42px 1fr 46px; align-items: center; gap: 5px; margin: 2px 0; }
  .stat .k { font-weight: 800; color: #8e3049; font-size: 11px; }
  .stat .v { text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
  .gauge { height: 8px; background: #e8dcc8; border: 1px solid #bba584; border-radius: 2px; overflow: hidden; }
  .gauge i { display: block; height: 100%; background: var(--ok); }
  .card .act { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .card .act .st { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { background: linear-gradient(#fffaf0, #efdfc4); border: 2px solid var(--ink); border-radius: 4px; padding: 2px 8px;
          font-size: 12px; font-weight: 800; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
  .rep h3 { margin: 6px 0; font-size: 14px; background: var(--ink); color: #f6dfe5; display: inline-block; padding: 2px 10px; border-radius: 3px; }
  .rep table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  .rep td, .rep th { border-bottom: 1px dashed #dcc6a8; padding: 5px 6px; text-align: left; }
  .rep th { color: #8e3049; font-size: 12px; }
  .awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .award { background: var(--paper2); border: 2px solid #dcc6a8; border-radius: 6px; padding: 8px; display: flex; gap: 8px; align-items: center; }
  .award .portrait { width: 44px; height: 44px; }
  .award .what { font-size: 12px; font-weight: 800; color: #a83552; }
  .award .who2 { font-weight: 800; }
  .award .why { font-size: 12px; color: #80606a; }

  /* 양옆 제자 목록 */
  .side { position: fixed; z-index: 2; display: flex; flex-direction: column; overflow: hidden; }
  .side[hidden] { display: none; }
  #sideL { left: 6px; } #sideR { right: 6px; }
  .side .list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .side .empty { color: #a08770; font-size: 13px; text-align: center; padding: 20px 6px; }
  .row { background: var(--paper2); border: 2px solid #dcc6a8; border-radius: 6px; padding: 5px 6px; display: flex;
         gap: 7px; cursor: pointer; align-items: center; }
  .row:hover, .row.on { border-color: var(--accent); background: #fbecee; }
  .row .portrait { width: 44px; height: 44px; border-width: 2px; }
  .row .info { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; }
  .row .nm { font-weight: 800; font-size: 13px; display: flex; gap: 4px; align-items: center; }
  .row .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm .chip { font-size: 10px; padding: 0 4px; flex: none; }
  .row .st, .row .la { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .la { color: #8a7068; font-size: 11px; }
  .row .gauge { height: 6px; margin: 2px 0; }

  @media (max-width: 640px) {
    #bottom { height: 84px; }
    #menu { grid-template-columns: repeat(4, 44px); gap: 4px; }
    .btn { font-size: 17px; } .btn span { font-size: 10px; }
    #logLines { font-size: 12px; }
    #hint, #dlg { bottom: 98px; }
    #top { gap: 4px; padding: 3px; }
    #top .plate { font-size: 12px; padding: 2px 8px 2px 5px; }
    #top .cell { font-size: 11px; padding: 1px 6px; gap: 3px; }
    #top .cell b { font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top" class="win">
  <div class="plate"><svg width="18" height="18" viewBox="-10 -10 20 20" aria-hidden="true">
    <g fill="#e2577a"><circle cx="0" cy="-5" r="4.4"/><circle cx="4.76" cy="-1.55" r="4.4"/><circle cx="2.94" cy="4.05" r="4.4"/>
    <circle cx="-2.94" cy="4.05" r="4.4"/><circle cx="-4.76" cy="-1.55" r="4.4"/></g><circle r="2.6" fill="#f5c542"/></svg>
    <span id="co">華山派</span></div>
  <div class="cell"><span class="lbl">시진</span><span id="date"></span></div>
  <div class="cell"><span class="lbl">제자</span><b id="sN">0</b>명</div>
  <div class="cell">⚔️ 수련 <b id="sB">0</b></div>
  <div class="cell">🍵 정비 <b id="sI">0</b></div>
  <div class="cell">💤 낮잠 <b id="sS">0</b></div>
  <div class="cell"><span class="lbl">재정</span><b id="sC">-</b></div>
</div>
<div id="sideL" class="win side" hidden><div class="title">⚔️ 수련 중 <span id="cntL"></span></div><div class="list" id="listL"></div></div>
<div id="sideR" class="win side" hidden><div class="title">🍵 개인정비 · 💤 낮잠 <span id="cntR"></span></div><div class="list" id="listR"></div></div>
<div id="toasts"></div>
<div id="hint"></div>
<div id="bottom">
  <div id="log" class="win"><div class="title">🔔 문파 소식</div><div id="logLines"></div></div>
  <div id="menu">
    <button class="btn" id="bStaff">👥<span>제자</span></button>
    <button class="btn" id="bReport">📜<span>장부</span></button>
    <a class="btn" href="/studio">🏢<span>스튜디오</span></a>
    <a class="btn" href="/">📋<span>목록</span></a>
  </div>
</div>
<div id="dlg" class="win" hidden>
  <canvas id="portrait" class="portrait" width="24" height="24"></canvas>
  <div class="body">
    <div class="who"><span id="dName"></span><span class="chip" id="dKind"></span><span class="role" id="dRole"></span></div>
    <div class="text" id="dText"></div>
    <div class="foot"><span id="dPage"></span><span class="next" id="dNext">▼ Space / 탭</span></div>
  </div>
</div>
<div id="modal" hidden>
  <div class="win sheet">
    <div class="title"><span id="mTitle"></span><button id="mClose">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
"use strict";
// ============================================================ 기본 설정
const T = 16;                       // 타일 크기(논리 px)
const COLS = 4;                     // 수련 자리 줄당 수 (짝수: 옆자리끼리 대련)
const TOPR = 4;                     // 위쪽 본전 영역(타일 행)
const SLEEP_AFTER = 3600;           // 이만큼(초) 대기하면 낮잠
const SKY = 240;                    // 배경 캐시에서 월드 위쪽으로 더 그리는 하늘 높이
const KIND = {
  claude: { color: "#d97757", label: "Claude" },
  codex:  { color: "#4f7cf0", label: "Codex" },
  grok:   { color: "#3a3f4b", label: "Grok" },
};
const C = {
  robe: "#f7f3ec", robeS: "#d6cdbf", trim: "#b4475f", belt: "#221b1f", beltH: "#3d3238", pants: "#2a2329", shoe: "#1a1418",
  wrap: "#2e262b", eye: "#2a1c22", blush: "#f2a3a8", red: "#cf3b55", gold: "#e0b84e", steel: "#e6ecf2", steelS: "#8d96a3",
  straw: "#d6b26c", strawS: "#a8843e", cel: "#a8d0bd", scroll: "#efe2bf", wood: "#7a4a2a", scab: "#3b2a22", OL: "#2a1c22",
};
const HAIR = ["#1f1a1d", "#2b2024", "#3b2a22", "#4a3326", "#1c2230", "#5a3d2b", "#2a2a33", "#6e6a72"];
const SKIN = ["#f9dcc4", "#f3cdb0", "#e8b893", "#cf9670"];

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

let W = 27, H = 17, solid = [], slots = [], loungeTiles = [], deco = [], DOOR_X = 12;
let bossSeat = { x: 0, y: 0 };

// ============================================================ 맵 생성
function buildWorld(nSlots) {
  const rows = Math.max(2, Math.ceil(nSlots / COLS));
  H = TOPR + 5 + rows * 4;
  solid = [];
  for (let y = 0; y < H; y++) {
    solid.push([]);
    for (let x = 0; x < W; x++) solid[y].push(x === 0 || x === W - 1 || y < TOPR || y === H - 1);
  }
  const block = (x, y, w = 1, h = 1) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) solid[y + j][x + i] = true; };
  // 산문
  DOOR_X = 12; solid[H - 1][12] = solid[H - 1][13] = false;
  // 수련 자리: 서는 곳(seatY) → 목인장(seatY+1) → 통로 2줄 (머리 위 라벨 공간)
  slots = [];
  for (let r = 0; r < rows; r++) {
    const seatY = TOPR + 1 + r * 4;
    for (let i = 0; i < COLS; i++) {
      const dx = 2 + i * 4;
      block(dx, seatY + 1, 2, 1);
      slots.push({ idx: slots.length, dx, seatY, deskY: seatY + 1, hitT: 0 });
    }
  }
  // 정원과 소품
  deco = [
    { t: "plum", x: 18, y: TOPR }, { t: "plum", x: 18, y: H - 2 },
    { t: "rack", x: 20, y: TOPR, w: 2 }, { t: "jar", x: 23, y: TOPR }, { t: "plum", x: 25, y: TOPR },
    { t: "teatable", x: 21, y: TOPR + 3, w: 2 }, { t: "lantern", x: 25, y: TOPR + 3 },
    { t: "lantern", x: 20, y: H - 3 }, { t: "plum", x: 25, y: H - 2 },
    { t: "boss", x: 2, y: H - 3, w: 3 }, { t: "banner", x: 1, y: H - 5 },
  ];
  for (const d of deco) block(d.x, d.y, d.w || 1, 1);
  bossSeat = { x: 3.5 * T, y: (H - 4) * T + 12 };
  loungeTiles = [];
  for (let y = TOPR + 1; y < H - 1; y++) for (let x = 20; x <= 25; x++) if (!solid[y][x]) loungeTiles.push({ x, y });
}
const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !solid[y][x];

function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const key = (x, y) => y * W + x, start = key(sx, sy), prev = new Map([[start, -1]]), q = [[sx, sy]];
  for (let qi = 0; qi < q.length; qi++) {
    const [x, y] = q[qi];
    if (x === tx && y === ty) {
      const path = [];
      for (let k = key(x, y); k !== start; k = prev.get(k)) path.push({ x: k % W, y: Math.floor(k / W) });
      return path.reverse();
    }
    for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ddx, ny = y + ddy, k = key(nx, ny);
      if (walkable(nx, ny) && !prev.has(k)) { prev.set(k, key(x, y)); q.push([nx, ny]); }
    }
  }
  return null;
}
const tileOf = e => ({ x: Math.floor(e.x / T), y: Math.floor(e.y / T) });

// ============================================================ 엔티티
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function makeLook(s) {
  const h = hash(s.session_id || s.pid), hat = s.mode === "headless" ? "straw" : "";
  return {
    id: `${s.kind}-${h}-${hat}`, skin: SKIN[h % SKIN.length], hair: HAIR[(h >>> 3) % HAIR.length], style: (h >>> 6) % 5,
    band: KIND[s.kind].color, robe: C.robe, robeS: C.robeS, trim: C.trim, hat,
  };
}
const player = {
  x: 0, y: 0, dir: "down", anim: 0, moving: false, path: [], speed: 72,
  look: { id: "master", skin: SKIN[1], hair: "#1c1a1e", style: 0, band: C.gold, robe: "#8a2b42", robeS: "#62182b",
          trim: C.gold, inner: C.robe, hat: "master" },
};
const npcs = new Map();   // pid -> npc
let firstSync = true, serverOffset = 0, host = "";
const now = () => Date.now() / 1000 + serverOffset;

function followPath(e, dt) {
  if (!e.path.length) { e.moving = false; return true; }
  const wp = e.path[0];
  const tx = wp.px ?? wp.x * T + T / 2, ty = wp.py ?? wp.y * T + 12;
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy), step = e.speed * dt;
  if (d <= step) { e.x = tx; e.y = ty; e.path.shift(); } else { e.x += dx / d * step; e.y += dy / d * step; }
  if (d > 0.01) e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  e.moving = true; e.anim += dt;
  return !e.path.length;
}

// ============================================================ 상태 해석
function idleSecs(s) {
  const t = s.status_since || s.last_activity;
  return t ? now() - t : 0;
}
function mood(s) {
  if (s.status === "stopped") return "stopped";
  if (s.status === "idle") return idleSecs(s) >= SLEEP_AFTER ? "sleep" : "rest";
  if (s.status === "busy") return "work";
  return "unknown";
}
function ctxPct(s) { return s.ctx_used != null && s.ctx_window ? Math.min(100, s.ctx_used / s.ctx_window * 100) : null; }
function shortDur(sec) {
  if (sec == null || !isFinite(sec) || sec < 0) return "";
  if (sec < 60) return Math.floor(sec) + "초";
  if (sec < 3600) return Math.floor(sec / 60) + "분";
  if (sec < 86400) return Math.floor(sec / 3600) + "시간";
  return Math.floor(sec / 86400) + "일";
}
function longDur(sec) {
  if (sec == null || !isFinite(sec) || sec < 0) return "-";
  sec = Math.floor(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return `${d}일 ${h}시간`;
  if (h) return `${h}시간 ${m}분`;
  if (m) return `${m}분`;
  return `${sec}초`;
}
// 개인정비 종류는 5분마다 바뀐다
const REST_ACTS = ["meditate", "tea", "polish", "read", "stretch"];
const REST_TXT = { meditate: "🧘 운기조식", tea: "🍵 차 한잔", polish: "✨ 검 손질", read: "📜 비급 열람", stretch: "🙆 몸풀기" };
const REST_SAY = { meditate: "운기조식을 하며", tea: "차를 한잔 마시며", polish: "검을 손질하며", read: "비급을 읽으며", stretch: "몸을 풀며" };
const restAct = pid => REST_ACTS[hash(pid + ":" + Math.floor(now() / 300)) % REST_ACTS.length];

function badge(s) {
  const k = helperBusy(s).length;
  return badgeBase(s) + (k ? ` 🌱${k}` : "");
}
function badgeBase(s) {
  const m = mood(s), pct = ctxPct(s), n = npcs.get(s.pid);

const NICKS = ["운학", "청하", "백설", "연화", "무진", "소혜", "진월", "매향", "현무", "설화", "도원", "비연", "한결", "서린", "초명", "은월"];

const FLAMES = { minimal: 0, low: 1, medium: 2, high: 3, xhigh: 4, max: 5 };

// ============================================================ 동기화
let slotOwner = [];   // slot idx -> pid
function ensureSlot(n) {
  if (n.slot != null) return;
  let i = slotOwner.findIndex(p => p == null);
  if (i < 0 || i >= slots.length) {
    const used = slotOwner.filter(p => p != null).length, oldH = H;
    buildWorld(Math.ceil((used + 4) / COLS) * COLS);
    slotOwner.length = slots.length;
    i = slotOwner.findIndex(p => p == null);
    // 수련 자리 줄이 늘면 장문인 단상·산문 구역이 아래로 밀리므로, 그 구역에 있던 사람도 함께 옮긴다
    const dy = (H - oldH) * T;
    for (const e of [player, ...npcs.values()]) {
      if (e === n || e.y < (oldH - 4) * T || e.x >= 20 * T) continue;
      e.y += dy; e.path = [];
      if (e !== player) e.goal = null;
    }
    if (!walkable(tileOf(player).x, tileOf(player).y)) Object.assign(player, bossSeat, { path: [] });
  }
  slotOwner[i] = n.pid; n.slot = i;
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("toasts").prepend(el);
  setTimeout(() => el.remove(), 5000);
}

async function sync() {
  let data;
  try { data = await (await fetch("/api/sessions", { cache: "no-store" })).json(); }
  catch { return; }
  serverOffset = data.now - Date.now() / 1000;
  host = data.host;
  const seen = new Set();
  if (firstSync) {
    buildWorld(Math.max(8, Math.ceil((data.sessions.length + 2) / COLS) * COLS));
    slotOwner = new Array(slots.length).fill(null);
    Object.assign(player, bossSeat);
  }
  for (const s of data.sessions) {
    seen.add(s.pid);
    let n = npcs.get(s.pid);
    if (!n) {
      n = { pid: s.pid, kind: s.kind, look: makeLook(s), x: 0, y: 0, dir: "down",
            anim: Math.random(), moving: false, path: [], speed: 40 + Math.random() * 10, goal: null, wait: 0,
            alpha: 1, data: s };
      npcs.set(s.pid, n);
      ensureSlot(n);
      if (firstSync) placeAtGoal(n);
      else {
        Object.assign(n, { x: (DOOR_X + .5) * T, y: (H - 1) * T + 12 });
        toast(`🌸 새 제자 ${KIND[s.kind].label} 「${displayName(s)}」 입문!`);
        addLog(s, `🙇 ${jobTitle(s)}(으)로 입문했습니다! (${s.model || "심법 미상"})`);
      }
    }
    detectActivity(n, s);
    if (n.data && n.data.status !== s.status && !firstSync) {
      if (mood(s) === "work") addLog(s, "⚔️ 수련을 시작했습니다.");
      else if (s.status === "idle") addLog(s, "🍵 수련을 마치고 개인정비에 들어갑니다.");
    }
    n.data = s;
    syncHelpers(n, s);
  }
  for (const n of npcs.values()) {
    if (!seen.has(n.pid) && !n.leaving) {
      n.leaving = true;
      toast(`👋 「${displayName(n.data)}」 하산합니다`);
      addLog(n.data, `👋 하산했습니다. (수련 ${longDur(n.data.elapsed)})`);
    }
  }
  if (!$("modal").hidden && modalKind === "staff") renderStaff();
  renderSide();
  firstSync = false;
  updateHud();
}

const logs = [];
const popups = [];

}
function renderLog() {
  const box = $("logLines");

  if (!rows.length) {
    box.innerHTML = `<div>🌸 화산에 오신 것을 환영합니다, 장문인! 제자를 탭하거나 다가가 Space를 누르면 수련 보고를 받을 수 있습니다.</div>`;

    + `<span class="nm" style="color:${KIND[r.s.kind].color}">${esc(displayName(r.s))}</span> ${esc(r.text)}</div>`).join("");
}
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const actKey = a => a ? `${a.t}|${a.text}` : "";
function detectActivity(n, s) {
  const acts = s.activity || [];
  const last = actKey(acts[acts.length - 1]);
  if (n.lastAct === undefined || firstSync) { n.lastAct = last; return; }
  if (last === n.lastAct) return;
  const idx = acts.findIndex(a => actKey(a) === n.lastAct);
  const fresh = (idx >= 0 ? acts.slice(idx + 1) : acts.slice(-1)).slice(-3);
  n.lastAct = last;
  const base = performance.now() / 1000;
  fresh.forEach((a, i) => {
    const label = a.kind === "tool" ? "+⚔️ " + a.text.split(":")[0].replace(/^mcp__\w+?__/, "") : "+📜 보고";
    popups.push({ n, text: label.length > 18 ? label.slice(0, 17) + "…" : label, kind: a.kind, t0: base + i * .7 });
    addLog(s, `${a.kind === "tool" ? "⚔️" : "📜"} ${a.text}`);
  });
}

// ============================================================ 이동 목표
// 옆자리(짝) 제자도 수련 중이면 둘이 가운데로 나와 대련한다
function partnerOf(n) {
  if (n.slot == null || n.leaving || mood(n.data) !== "work") return null;
  const pid = slotOwner[n.slot ^ 1];
  const p = pid == null ? null : npcs.get(pid);
  return p && !p.leaving && mood(p.data) === "work" ? p : null;
}
function goalOf(n) {
  if (n.leaving) return "door";
  const m = mood(n.data);
  if (m === "rest" || m === "sleep") return "lounge";
  return partnerOf(n) ? "spar" : "seat";
}
function seatPos(n, goal = n.goal) {
  const s = slots[n.slot], y = s.seatY * T + 12;
  if (goal !== "spar") return { x: (s.dx + 1) * T, y };
  const left = n.slot % 2 === 0, L = left ? s.dx : s.dx - 4, mid = (L + 3) * T;
  return { x: mid + (left ? -18 : 18), y };
}
const sparDir = n => n.slot % 2 === 0 ? "right" : "left";
function pickLounge(n) {
  const taken = new Set([...npcs.values()].filter(o => o !== n && o.lt).map(o => o.lt.x + "," + o.lt.y));
  const free = loungeTiles.filter(t => !taken.has(t.x + "," + t.y));
  const pool = free.length ? free : loungeTiles;
  // 머리 위 라벨이 겹치지 않도록 다른 제자와 가장 먼 후보를 고른다
  const others = [...npcs.values()].filter(o => o !== n && o.lt).map(o => o.lt);
  let best = null, bd = -1;
  for (let i = 0; i < 8; i++) {
    const c = pool[Math.floor(Math.random() * pool.length)];
    const d = Math.min(99, ...others.map(o => Math.abs(o.x - c.x) * 1.5 + Math.abs(o.y - c.y)));
    if (d > bd) { bd = d; best = c; }
  }
  return (n.lt = best);
}
function placeAtGoal(n) {
  n.goal = goalOf(n);
  if (n.goal === "seat" || n.goal === "spar") { Object.assign(n, seatPos(n)); n.dir = n.goal === "spar" ? sparDir(n) : "down"; }
  else { const t = pickLounge(n); n.x = t.x * T + 8; n.y = t.y * T + 12; n.wait = 10 + Math.random() * 20; }
}
function planPath(n) {
  const st = tileOf(n);
  if (n.goal === "seat" || n.goal === "spar") {
    const p = seatPos(n), tt = tileOf(p), path = findPath(st.x, st.y, tt.x, tt.y);
    n.path = [...(path || []), { px: p.x, py: p.y }];
  } else if (n.goal === "lounge") {
    const t = pickLounge(n);
    n.path = findPath(st.x, st.y, t.x, t.y) || [];
    n.wait = mood(n.data) === "sleep" ? 1e9 : 15 + Math.random() * 25;
  } else {
    n.path = [...(findPath(st.x, st.y, DOOR_X, H - 1) || []), { px: (DOOR_X + .5) * T, py: H * T + 6 }];
  }
}

function updateNpc(n, dt) {
  const g = goalOf(n);
  if (g !== n.goal) { if (n.goal === "lounge") n.lt = null; n.goal = g; planPath(n); }
  if (dlg && dlg.npc === n) {          // 대화 중엔 멈춰서 장문인을 바라본다
    n.moving = false;
    n.dir = faceTo(n, player);
    return;
  }
  if (n.path.length) { followPath(n, dt); return; }
  n.moving = false;
  if (n.goal === "seat") n.dir = "down";
  else if (n.goal === "spar") n.dir = sparDir(n);
  else if (n.goal === "lounge") { n.wait -= dt; if (n.wait <= 0) planPath(n); }
  else if (n.goal === "door") {
    n.alpha -= dt * 2;
    if (n.alpha <= 0) { npcs.delete(n.pid); slotOwner[n.slot] = null; updateHud(); }
  }
  n.anim += dt;
}
function faceTo(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
}
const arrived = n => !n.path.length && !n.leaving;

// ============================================================ 서브에이전트 → 사제
const HELPER_MAX = 2;                       // 제자 한 명 곁에 보이는 사제 수 (나머지는 배지 숫자로만)
const helperBusy = s => (s.subagents || []).filter(a => a.status === "busy");
function helperName(a) {
  const t = String(a.name || a.type || "사제").replace(/^\[[^\]]*\]\s*/, "");
  return t.length > 14 ? t.slice(0, 13) + "…" : t;
}
function syncHelpers(n, s) {
  n.helpers = n.helpers || new Map();
  const live = helperBusy(s), ids = new Set(live.map(a => a.id));
  for (const a of live) {
    let h = n.helpers.get(a.id);
    if (!h) {
      const used = new Set([...n.helpers.values()].filter(o => !o.leaving).map(o => o.idx));
      let idx = 0;
      while (used.has(idx)) idx++;
      const look = makeLook({ kind: n.kind, session_id: (s.session_id || n.pid) + ":" + a.id });
      Object.assign(look, { id: look.id + "-sub", style: 3 });   // 짧은 머리 + 머리띠 = 사제
      h = { id: a.id, parent: n, idx, x: n.x, y: n.y, dir: "down", anim: Math.random(), moving: false,
            alpha: firstSync ? 1 : 0, snap: firstSync, look, data: a, seed: hash(a.id) % 97 / 97 };
      n.helpers.set(a.id, h);
      if (!firstSync) addLog(s, `🌱 사제 「${helperName(a)}」에게 과제를 나눠 맡겼습니다.`);
    }
    h.data = a;
  }
  for (const h of n.helpers.values())
    if (!ids.has(h.id) && !h.leaving) {
      h.leaving = true;
      if (!firstSync) addLog(s, `✅ 사제 「${helperName(h.data)}」이(가) 과제를 마쳤습니다.`);
    }

function helperTarget(n, h) {
  // 대련 중이면 상대와 반대쪽(바깥)에, 아니면 양옆에 선다
  if (n.goal === "spar" && arrived(n)) { const side = n.slot % 2 === 0 ? -1 : 1; return { x: n.x + side * (22 + 16 * h.idx), y: n.y }; }
  return { x: n.x + (h.idx % 2 ? -22 : 22), y: n.y };
}
function updateHelpers(n, dt) {
  if (!n.helpers) return;
  for (const h of [...n.helpers.values()]) {
    if (h.leaving || n.leaving) { h.alpha -= dt * 1.5; if (h.alpha <= 0) n.helpers.delete(h.id); continue; }
    h.alpha = Math.min(1, h.alpha + dt * 2);
    if (h.idx >= HELPER_MAX) continue;
    const tg = helperTarget(n, h);
    if (h.snap) { Object.assign(h, tg); h.snap = false; }
    h.anim += dt;
    if (dlg && dlg.npc === h) { h.moving = false; h.dir = faceTo(h, player); continue; }
    const dx = tg.x - h.x, dy = tg.y - h.y, d = Math.hypot(dx, dy);

function updateHud() {
  const list = [...npcs.values()].filter(n => !n.leaving).map(n => n.data);
  $("co").textContent = `華山派 ${(host || "AI").toUpperCase()} 분타`;
  const cost = list.reduce((a, s) => a + (s.cost_usd || 0), 0);
  $("sC").textContent = cost ? `$${cost.toFixed(2)}` : "-";
  $("sN").textContent = list.length;
  $("sB").textContent = list.filter(s => mood(s) === "work").length;

const keys = new Set();
addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  if (!$("modal").hidden) { if (e.key === "Escape") closeModal(); return; }

let talkTarget = null;

  if (near) {
    const p = 1 + Math.sin(t * 6) * .12;
    ctx.font = `${16 * p}px sans-serif`; ctx.textAlign = "left";
    ctx.fillText("💬", top.x + bw / 2 + 4, y + bob);
  }
  ctx.globalAlpha = 1;
}

const SIJIN = "자축인묘진사오미신유술해";
let lastT = performance.now();
function frame(ms) {
  const dt = Math.min(.05, (ms - lastT) / 1000); lastT = ms;
  const t = ms / 1000;
  if (!firstSync) {
    updatePlayer(dt);
    for (const n of [...npcs.values()]) { updateNpc(n, dt); updateHelpers(n, dt); }
    updateFx(dt, t);
    updateCamera();
    draw(t);
    if (dlg) {
      const full = dlg.pages[dlg.page];
      if (dlg.shown < full.length) { dlg.shown = Math.min(full.length, dlg.shown + dt * 55); renderDialogText(); }
    }
    const n = !dlg && nearestNpc();
    const narrow = innerWidth < 640;
    $("hint").textContent = n ? `${narrow ? "탭" : "Space 또는 탭"}: 「${displayName(n.data)}」에게 보고 받기`
      : narrow ? "탭해서 이동 · 제자를 탭하면 보고" : "방향키·WASD 또는 화면 탭으로 이동 · 제자를 탭하면 다가가서 보고를 받아요";
  }
  const d = new Date();
  $("date").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 · ${SIJIN[Math.floor(((d.getHours() + 1) % 24) / 2)]}시 `
    + d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  requestAnimationFrame(frame);
}

// ============================================================ 제자 명부 / 장부
let modalKind = null;
function openModal(kind) {
  modalKind = kind;
  closeDialog();
  $("modal").hidden = false;
  if (kind === "staff") renderStaff(); else renderReport();
}
function closeModal() { $("modal").hidden = true; modalKind = null; }
$("bStaff").onclick = () => openModal("staff");
$("bReport").onclick = () => openModal("report");
$("mClose").onclick = closeModal;
$("modal").addEventListener("pointerdown", e => { if (e.target.id === "modal") closeModal(); });

function portraitHTML(n, cls = "portrait") {
  const c = document.createElement("canvas");
  c.width = 24; c.height = 24; c.className = cls;
  drawChar(c.getContext("2d"), 12, 33, n.look, { dir: "down", noShadow: true, closed: mood(n.data) === "sleep" });
  return c;
}
function gauge(label, pct, value, color) {
  const col = color || (pct >= 60 ? "var(--ok)" : pct >= 25 ? "var(--mid)" : "var(--bad)");
  return `<div class="stat"><span class="k">${label}</span><span class="gauge"><i style="width:${pct == null ? 0 : Math.max(2, pct)}%;background:${col}"></i></span><span class="v">${value}</span></div>`;
}
function moodText(s) {
  const m = mood(s);
  if (m === "rest") return REST_TXT[restAct(s.pid)];
  return { work: "⚔️ 수련 중", sleep: "💤 낮잠", stopped: "🧊 점혈", unknown: "❓ 불명" }[m];
}
const activeStaff = () => [...npcs.values()].filter(n => !n.leaving);
function renderStaff() {
  const order = { work: 0, rest: 1, sleep: 2, stopped: 3, unknown: 4 };
  const list = activeStaff().sort((a, b) => order[mood(a.data)] - order[mood(b.data)] || b.data.elapsed - a.data.elapsed);
  $("mTitle").textContent = `👥 제자 명부 (${list.length}명)`;
  const wrap = document.createElement("div"); wrap.className = "staff";
  for (const n of list) {
    const s = n.data, pct = ctxPct(s), fl = FLAMES[s.effort];
    const lastAct = (s.activity || []).slice(-1)[0];
    const card = document.createElement("div"); card.className = "card";
    card.appendChild(portraitHTML(n));
    const info = document.createElement("div"); info.className = "info";
    info.innerHTML = `<div class="nm">${esc(displayName(s))} <span class="chip" style="background:${KIND[s.kind].color}">${KIND[s.kind].label}</span></div>
      <div class="sub">${esc(jobTitle(s))} · ${esc(s.model || "?")}</div>
      ${gauge("기력", pct == null ? null : 100 - pct, pct == null ? "?" : `${Math.round(100 - pct)}%`)}
      ${gauge("내공", fl == null ? null : fl / 5 * 100, esc(s.effort || "?"), "#b4475f")}
      ${gauge("수련", Math.min(100, Math.log10(1 + (s.elapsed || 0) / 60) / Math.log10(1 + 43200) * 100), shortDur(s.elapsed), "#7a5ab8")}
      <div class="act"><span class="st">${moodText(s)} · ${lastAct ? esc(lastAct.text) : "기록 없음"}</span></div>`;
    const btn = document.createElement("button"); btn.className = "mini"; btn.textContent = "📣 불러서 보고";
    btn.onclick = () => { closeModal(); callOver(n); };
    info.querySelector(".act").appendChild(btn);
    card.appendChild(info);
    wrap.appendChild(card);
  }
  $("mBody").replaceChildren(wrap);
}
function callOver(n) {
  talkTarget = n;
  if (dist(player, n) < 24) { openDialog(n); talkTarget = null; return; }
  const pt = tileOf(player), tt = tileOf(n);
  player.path = findPath(pt.x, pt.y, tt.x, tt.y) || [];
}
function renderReport() {
  const list = activeStaff(), S = list.map(n => n.data);
  $("mTitle").textContent = "📜 문파 장부";
  const cnt = f => S.filter(f).length;
  const pcts = S.map(ctxPct).filter(v => v != null);
  const cost = S.reduce((a, s) => a + (s.cost_usd || 0), 0);
  const spar = list.filter(n => mood(n.data) === "work" && partnerOf(n)).length;
  let html = `<div class="rep"><h3>문파 개요</h3><table>
    <tr><th>총 제자</th><td>${S.length}명 (본산 ${cnt(s => s.mode !== "headless")} · 객원 ${cnt(s => s.mode === "headless")})</td></tr>
    <tr><th>수련 현황</th><td>⚔️ ${cnt(s => mood(s) === "work")} (대련 ${spar}) · 🍵 ${cnt(s => mood(s) === "rest")} · 💤 ${cnt(s => mood(s) === "sleep")}</td></tr>
    <tr><th>사제</th><td>🌱 ${S.reduce((a, s) => a + helperBusy(s).length, 0)}명 수련 중 (서브에이전트)</td></tr>
    <tr><th>평균 기력 소모</th><td>${pcts.length ? (pcts.reduce((a, b) => a + b, 0) / pcts.length).toFixed(1) + "%" : "-"}</td></tr>
    <tr><th>집계된 재정 지출</th><td>${cost ? "$" + cost.toFixed(2) + " (Grok 세션 기준)" : "-"}</td></tr>
  </table><h3>계파별 현황</h3><table><tr><th>계파</th><th>인원</th><th>수련</th><th>심법(모델)</th></tr>`;
  for (const k of Object.keys(KIND)) {
    const ks = S.filter(s => s.kind === k);
    if (!ks.length) continue;
    const models = [...new Set(ks.map(s => s.model).filter(Boolean))].join(", ");
    html += `<tr><td><span class="chip" style="background:${KIND[k].color}">${KIND[k].label}</span></td><td>${ks.length}</td>
      <td>${ks.filter(s => mood(s) === "work").length}</td><td>${esc(models || "-")}</td></tr>`;
  }
  html += `</table><h3>🏆 이달의 제자</h3><div class="awards" id="awards"></div></div>`;
  $("mBody").innerHTML = html;

  const pick = (f, score) => { let b = null, bs = -Infinity; for (const n of list) if (f(n.data)) { const v = score(n.data); if (v > bs) { bs = v; b = n; } } return b; };
  const awards = [
    ["🏯 터줏대감상", pick(() => true, s => s.elapsed), s => `수련 ${longDur(s.elapsed)}`],
    ["⚡ 정진상", pick(s => mood(s) === "work", s => (s.activity || []).slice(-1)[0]?.t || 0), s => `지금도 수련 중 · ${shortDur(now() - (s.status_since || now() - s.elapsed))}째`],
    ["🔥 심공상", pick(s => s.effort in FLAMES, s => FLAMES[s.effort] * 1e9 - (s.elapsed || 0)), s => `내공 ${s.effort} ${flames(s.effort)}`],
    ["😵 주화입마 주의", pick(s => ctxPct(s) != null, s => ctxPct(s)), s => `기력 소모 ${ctxPct(s).toFixed(1)}%`],
    ["😴 잠룡상", pick(s => mood(s) === "sleep", s => idleSecs(s)), s => `${longDur(idleSecs(s))}째 낮잠 중`],
  ];
  const box = $("awards");
  for (const [what, n, why] of awards) {
    if (!n) continue;
    const el = document.createElement("div"); el.className = "award";
    el.appendChild(portraitHTML(n));
    el.insertAdjacentHTML("beforeend", `<div><div class="what">${what}</div><div class="who2">${esc(displayName(n.data))}</div><div class="why">${esc(why(n.data))}</div></div>`);
    el.style.cursor = "pointer"; el.onclick = () => { closeModal(); callOver(n); };
    box.appendChild(el);
  }
}

let hoverPid = null;
function sideRow(n) {
  const s = n.data, pct = ctxPct(s), lastAct = (s.activity || []).slice(-1)[0];
  const row = document.createElement("div");
  row.className = "row" + (hoverPid === n.pid ? " on" : "");
  row.appendChild(portraitHTML(n));
  const col = pct == null ? "" : pct >= 80 ? "var(--bad)" : pct >= 50 ? "var(--mid)" : "var(--ok)";
  const st = mood(s) === "rest" ? `${REST_TXT[restAct(s.pid)]} ${shortDur(idleSecs(s))}` : badge(s);
  row.insertAdjacentHTML("beforeend", `<div class="info">
    <div class="nm"><span>${esc(displayName(s))}</span><span class="chip" style="background:${KIND[s.kind].color}">${KIND[s.kind].label}</span></div>
    <div class="st">${esc(st)} · ${esc((s.model || "?").replace(/^claude-/, ""))} ${flames(s.effort)}</div>
    <div class="gauge" title="기력 소모(컨텍스트)"><i style="width:${pct ?? 0}%;background:${col}"></i></div>
    <div class="la">${lastAct ? esc(lastAct.text) : esc(s.task || "기록 없음")}</div></div>`);
  row.onmouseenter = () => { hoverPid = n.pid; row.classList.add("on"); };
  row.onmouseleave = () => { if (hoverPid === n.pid) hoverPid = null; row.classList.remove("on"); };
  row.onclick = () => callOver(n);
  return row;
}
function renderSide() {
  if (!panelW) return;
  const list = activeStaff();
  const L = list.filter(n => mood(n.data) === "work")
    .sort((a, b) => (b.data.status_since || 0) - (a.data.status_since || 0));
  const R = list.filter(n => mood(n.data) !== "work")
    .sort((a, b) => idleSecs(a.data) - idleSecs(b.data));
  const fill = (id, cnt, rows, empty) => {
    $(cnt).textContent = `(${rows.length})`;
    if (!rows.length) { $(id).innerHTML = `<div class="empty">${empty}</div>`; return; }
    $(id).replaceChildren(...rows.map(sideRow));
  };
  fill("listL", "cntL", L, "지금은 모두 쉬는 중입니다 🍵");
  fill("listR", "cntR", R, "전원 수련 중! 🔥");
}

renderLog();
resize();
sync();
setInterval(sync, 3000);
requestAnimationFrame(frame);
</script>
</body>
